# Render Blueprint for EZ Techlabs (@ez.techlabs)
# Automatic provision of Django 5 + Python 3.12 + PostgreSQL 16
version: "1"

databases:
  - name: ez-techlabs-db
    databaseName: ez_techlabs_db
    user: ez_user
    plan: free
    region: ohio

services:
  - type: web
    name: ez-techlabs-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,eztechlabs.com"
      - key: ADMIN_URL_PATH
        value: gestor-ez/
      - key: ADMIN_DEFAULT_USER
        value: admin
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@eztechlabs.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: Ingeniero01*
      - key: FRONTEND_URL
        value: https://ez-techlabs-ve.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: ez-techlabs-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "False" # Render handles SSL termination at proxy level

